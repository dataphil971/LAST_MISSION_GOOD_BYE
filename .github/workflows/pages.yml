# Publication du jeu sur GitHub Pages.
#
# Le depot se sert tel quel : aucun build, aucune dependance. On verifie
# quand meme que le parcours complet passe avant de publier.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Parcours complet (headless)
        run: node tools/smoke_test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        # Active Pages si ce n'est pas deja fait. Sans cela, l'etape echoue
        # tant que Settings > Pages > Source n'est pas sur « GitHub Actions »,
        # et le message d'erreur ne le dit pas clairement.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
